name: CeX UK Daily Price Tracker

on:
  schedule:
    # 18:00 Europe/Istanbul; TCMB publishes the business-day rate after 15:30.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: Refresh source
        required: false
        default: github

concurrency:
  group: cex-catalog-sync
  cancel-in-progress: false

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIN_ITEMS_PER_PLATFORM: '25'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Apply database migrations
        run: python scripts/migrate_db.py

      - name: Scrape, validate and persist CeX prices
        run: python scripts/scrape_all_cex.py
