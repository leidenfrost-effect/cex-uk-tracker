services:
  postgres:
    image: postgres:16-alpine
    container_name: cex-tracker-postgres
    environment:
      POSTGRES_DB: cex_tracker
      POSTGRES_USER: cex_local
      POSTGRES_PASSWORD: cex_local
    ports:
      - "5433:5432"
    volumes:
      - cex_tracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cex_local -d cex_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cex_tracker_postgres_data:
